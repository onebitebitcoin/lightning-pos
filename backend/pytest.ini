[pytest]
DJANGO_SETTINGS_MODULE = kiosk_backend.settings
python_files = tests/test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --cov=accounts
    --cov=products
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=85
    --cov-config=.coveragerc
    -v
